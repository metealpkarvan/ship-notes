name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.9', '3.10', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.13'
          - os: macos-15-intel
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Report native Python architecture
        run: python -c "import platform; print(platform.system(), platform.machine())"
      - run: python -m unittest discover -v
      - name: Verify package installation and console entry point
        run: |
          python -m pip install .
          ship-notes --version
          ship-notes --days 7 --no-links --format json
